      ></div></div><div class="footer"></div></div><!-- /noindex --><!--googleon: all--><script type="text/javascript">
  'use strict'
  ;(function () {
    history.scrollRestoration = 'manual'

    var form = document.getElementById('code_form')
    var input = document.getElementById('code_input')
    var submit = document.getElementById('code_submit')
    var code = getCookie('f_access_code')
    input.focus()

    if (code) {
      input.value = code
      form.classList.add('error')
      unsetCookie('f_access_code')
    }

    var p = false
    var keyCodes = [8, 13, 17, 34, 35, 36, 37, 38, 39, 40, 46]
    var validationTimeout = false

    input.onkeydown = function (e) {
      var value = ''.concat(e.target.value)

      if (value.length >= 6 && !keyCodes.includes(e.keyCode) && !e.ctrlKey && !e.metaKey) {
        e.preventDefault()
      }

      if (!/^\d{1,1}$/.test(e.key) && !keyCodes.includes(e.keyCode) && !e.ctrlKey && !e.metaKey) {
        e.preventDefault()
      }
    }

    input.oninput = function (e) {
      var value = ''.concat(e.target.value)

      form.classList.remove('error')

      if (value.length === 6 && !keyCodes.includes(e.keyCode) && !e.ctrlKey && !e.metaKey) {
        setTimeout(function () {
          checkCode()
        }, 0)
      }
    }

    input.onpaste = function (e) {
      setTimeout(function () {
        checkCode()
      }, 0)
    }

    form.onsubmit = function (e) {
      e.preventDefault()
      checkCode()
    }

    function checkCode(paste) {
      if (validationTimeout) {
        clearTimeout(validationTimeout)
      }

      validationTimeout = setTimeout(function () {
        var s = ''.concat(input.value)
        if (p || !s.length) {
          form.classList.add('error')
          return false
        }

        p = true
        form.classList.remove('error')
        setCookie('f_access_code', s, 365)
        submit.classList.add('pending')
        window.scrollTo(0, 0)

        window.location.reload()
      }, 200)
    }

    function setCookie(cname, cvalue, exdays) {
      var d = new Date()
      d.setTime(d.getTime() + exdays * 24 * 60 * 60 * 1000)
      var expires = 'expires='.concat(d.toUTCString())
      const secure = location.protocol === 'https:' ? ';SameSite=None;Secure' : ''

      document.cookie = ''.concat(cname, '=').concat(cvalue, ';').concat(expires, ';path=/', secure)
    }

    function unsetCookie(cname) {
      document.cookie = cname + '=; expires=Thu, 01 Jan 1970 00:00:01 GMT;'
    }

    function getCookie(cname) {
      var name = ''.concat(cname, '=')
      var decodedCookie = decodeURIComponent(document.cookie)
      var ca = decodedCookie.split(';')

      for (var i = 0; i < ca.length; i++) {
        var c = ca[i]

        while (c.charAt(0) === ' ') {
          c = c.substring(1)
        }

        if (c.indexOf(name) === 0) {
          return c.substring(name.length, c.length)
        }
      }

      return false
    }
  })()
</script></body></html>
